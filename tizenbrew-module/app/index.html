<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadowbox Launcher</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a1628;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      color: #7ed6ff;
      overflow: hidden;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(126, 214, 255, 0.2);
      border-top-color: #7ed6ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h1>Shadowbox</h1>
    <p>Loading from NAS…</p>
  </div>

  <script>
    // ---------------------------------------------------------------
    // CONFIG – change this if your NAS address is different
    // ---------------------------------------------------------------
    const NAS_URL = 'http://ds223.local/frametv/';

    // Small delay so the splash looks intentional, then redirect
    setTimeout(() => {
      window.location.replace(NAS_URL);
    }, 600);

    // Fallback: if the NAS is unreachable after a few seconds, show a message
    setTimeout(() => {
      document.querySelector('p').textContent =
        'Could not reach NAS. Check that ds223.local/frametv is online.';
    }, 8000);
  </script>
</body>
</html>
